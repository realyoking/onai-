<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>RG_OS v46.0 - Final Repair</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <style>
        body { font-family: -apple-system, sans-serif; background: #f0f2f5; height: 100vh; display: flex; overflow: hidden; color: #111; }
        #sidebar { width: 260px; background: #fff; border-right: 1px solid #e5e7eb; display: flex; flex-direction: column; z-index: 50; }
        .tab { padding: 12px 16px; margin: 4px 12px; border-radius: 12px; font-size: 13px; cursor: pointer; color: #4b5563; transition: 0.2s; display: flex; align-items: center; gap: 10px; font-weight: 700; }
        .tab.active { background: #000 !important; color: #fff !important; }
        #main-stage { flex: 1; background: #fff; position: relative; display: flex; flex-direction: column; }
        .tool-panel { display: none; height: 100%; width: 100%; flex-direction: column; overflow: hidden; }
        .tool-panel.active { display: flex !important; }
        .cal-btn { height: 55px; border-radius: 12px; font-weight: 900; background: #f3f4f6; transition: 0.1s; display: flex; align-items: center; justify-content: center; }
        .cal-btn:active { transform: scale(0.92); background: #e5e7eb; }
        .card { background: #f9fafb; border: 1px solid #eee; border-radius: 24px; padding: 24px; }
        ::-webkit-scrollbar { width: 4px; }
        ::-webkit-scrollbar-thumb { background: #ddd; border-radius: 10px; }
    </style>
</head>
<body>

<aside id="sidebar">
    <div class="p-6 text-xl font-black italic tracking-tighter flex items-center gap-2">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3"><path d="M13 2L3 14h9l-1 8 10-12h-9l1-8z"/></svg>
        RG_OS v46
    </div>
    <nav class="flex-1 overflow-y-auto px-3 space-y-1">
        <div onclick="App.openTool('chat')" id="tab-chat" class="tab active">阮峻对话</div>
        <div onclick="App.openTool('cal')" id="tab-cal" class="tab">阮峻Cal</div>
        <div onclick="App.openTool('dict')" id="tab-dict" class="tab">阮峻Dict</div>
        <div onclick="App.openTool('grade')" id="tab-grade" class="tab">成绩评分</div>
        <div onclick="App.openTool('weather')" id="tab-weather" class="tab">天气搜索</div>
        <div onclick="App.openTool('novel')" id="tab-novel" class="tab">阮峻Novel</div>
    </nav>
    <div class="p-4 border-t">
        <button onclick="App.openSettings(true)" class="w-full flex items-center gap-3 p-2 hover:bg-gray-50 rounded-xl transition">
            <div class="w-8 h-8 rounded-full bg-black text-white flex items-center justify-center text-[10px]">⚙️</div>
            <div id="u-display" class="text-xs font-black">加载中...</div>
        </button>
    </div>
</aside>

<main id="main-stage">
    <div id="panel-chat" class="tool-panel active">
        <header class="h-14 border-b flex items-center px-6 gap-3">
            <div id="led" class="w-2 h-2 rounded-full bg-red-500"></div>
            <span id="status" class="text-[10px] font-black text-gray-400 uppercase">Wait...</span>
        </header>
        <div id="scroller" class="flex-1 overflow-y-auto p-6">
            <div id="chat-view" class="max-w-2xl mx-auto space-y-6"></div>
        </div>
        <div class="p-6">
            <div class="max-w-2xl mx-auto flex items-end bg-gray-100 rounded-2xl p-2 pr-4">
                <textarea id="minp" rows="1" class="flex-1 bg-transparent border-none outline-none py-3 px-4 font-medium" placeholder="跟我聊聊..." oninput="App.rsz()"></textarea>
                <button id="sbtn" onclick="App.send()" disabled class="w-10 h-10 bg-black text-white rounded-full flex items-center justify-center font-bold">↑</button>
            </div>
        </div>
    </div>

    <div id="panel-cal" class="tool-panel bg-gray-50">
        <header class="p-6 font-black text-lg border-b bg-white">乱算器</header>
        <div class="flex-1 flex items-center justify-center p-4">
            <div class="card w-full max-w-[320px] bg-white shadow-2xl">
                <div id="cal-display" class="bg-gray-100 p-6 rounded-2xl mb-4 text-right text-3xl font-black h-24 flex items-center justify-end overflow-hidden">0</div>
                <div class="grid grid-cols-4 gap-2">
                    <button onclick="App.calClear()" class="cal-btn text-red-500">C</button>
                    <button onclick="App.calNum('/')" class="cal-btn">/</button>
                    <button onclick="App.calNum('*')" class="cal-btn">×</button>
                    <button onclick="App.calNum('-')" class="cal-btn">-</button>
                    <button onclick="App.calNum('7')" class="cal-btn">7</button>
                    <button onclick="App.calNum('8')" class="cal-btn">8</button>
                    <button onclick="App.calNum('9')" class="cal-btn">9</button>
                    <button onclick="App.calNum('+')" class="cal-btn">+</button>
                    <button onclick="App.calNum('4')" class="cal-btn">4</button>
                    <button onclick="App.calNum('5')" class="cal-btn">5</button>
                    <button onclick="App.calNum('6')" class="cal-btn">6</button>
                    <button onclick="App.calNum('.')" class="cal-btn">.</button>
                    <button onclick="App.calNum('1')" class="cal-btn">1</button>
                    <button onclick="App.calNum('2')" class="cal-btn">2</button>
                    <button onclick="App.calNum('3')" class="cal-btn">3</button>
                    <button onclick="App.calNum('0')" class="cal-btn">0</button>
                    <button onclick="App.calRes()" class="cal-btn bg-black text-white col-span-4">＝</button>
                </div>
            </div>
        </div>
    </div>

    <div id="panel-dict" class="tool-panel">
        <header class="p-6 font-black text-lg border-b">阮峻离谱词典</header>
        <div class="p-10 max-w-xl mx-auto w-full">
            <div class="flex gap-2 mb-8">
                <input id="dict-in" class="flex-1 p-4 bg-gray-100 rounded-xl font-bold outline-none" placeholder="输入单词...">
                <button onclick="App.lookup()" class="px-6 bg-black text-white rounded-xl font-black">翻译</button>
            </div>
            <div id="dict-out"></div>
        </div>
    </div>

    <div id="panel-weather" class="tool-panel">
        <header class="p-6 font-black text-lg border-b">天气</header>
        <div class="p-10 max-w-md mx-auto w-full text-center">
            <div class="flex gap-2 mb-10">
                <input id="we-city" class="flex-1 p-4 bg-gray-100 rounded-xl outline-none" placeholder="City (Tokyo)">
                <button onclick="App.getWeather()" class="px-4 bg-black text-white rounded-xl">🔍</button>
            </div>
            <div id="we-box" class="hidden">
                <div id="we-temp" class="text-8xl font-black mb-2 tracking-tighter">--°C</div>
                <div id="we-desc" class="text-xl font-bold text-gray-400 mb-6 uppercase">--</div>
                <div id="we-comment" class="card bg-blue-50 text-blue-900 text-sm font-bold italic"></div>
            </div>
        </div>
    </div>

    <div id="panel-novel" class="tool-panel">
        <header class="p-6 border-b flex justify-between bg-white">
            <span class="font-black text-lg">Novel</span>
            <button onclick="App.createBook()" class="px-4 py-1 border-2 border-black rounded-full text-[10px] font-black uppercase">New</button>
        </header>
        <div id="nv-view" class="flex-1 overflow-y-auto p-10 space-y-10 max-w-3xl mx-auto"></div>
        <div class="p-6 border-t bg-gray-50">
            <button id="nv-btn" onclick="App.writeChapter()" disabled class="w-full py-4 bg-black text-white rounded-2xl font-black shadow-lg">生成下一章</button>
        </div>
    </div>

    <div id="panel-grade" class="tool-panel p-10">
        <div class="max-w-md mx-auto card space-y-4">
            <input id="gr-sub" class="w-full p-4 bg-gray-100 rounded-xl" placeholder="科目">
            <div class="flex gap-3">
                <input id="gr-score" type="number" class="w-1/2 p-4 bg-gray-100 rounded-xl" placeholder="得分">
                <input id="gr-full" type="number" class="w-1/2 p-4 bg-gray-100 rounded-xl" placeholder="满分">
            </div>
            <button onclick="App.rateGrade()" class="w-full py-4 bg-black text-white rounded-xl font-black">审判</button>
            <div id="gr-res" class="hidden p-6 bg-red-50 text-red-600 font-black italic rounded-xl"></div>
        </div>
    </div>
</main>

<div id="settings-modal" class="fixed inset-0 bg-black/60 backdrop-blur-md hidden z-[100] items-center justify-center p-6">
    <div class="bg-white p-8 rounded-[40px] w-full max-w-sm">
        <input id="in-name" class="w-full mb-6 p-4 bg-gray-100 rounded-2xl font-bold" placeholder="名字">
        <button onclick="App.saveSettings()" class="w-full p-4 bg-black text-white rounded-2xl font-black">确认重启</button>
    </div>
</div>

<script type="module">
import * as webllm from "https://esm.run/@mlc-ai/web-llm";

const App = {
    engine: null,
    ready: false,
    busy: false,
    user: JSON.parse(localStorage.getItem('rg_u') || '{"name":"元宝爸爸"}'),
    persona: "你是14岁的阮峻gay。毒舌，迷恋新干线，讨厌曾俊伟。直接喷人。",
    pendingTool: null,
    novelHistory: [],

    async init() {
        document.getElementById('u-display').innerText = this.user.name;
        this.reInit();
    },

    async reInit() {
        this.ready = false;
        try {
            this.engine = await webllm.CreateMLCEngine("Qwen2.5-1.5B-Instruct-q4f16_1-MLC", {
                initProgressCallback: (p) => {
                    document.getElementById('status').innerText = `${Math.round(p.progress * 100)}%`;
                    if(p.progress === 1) {
                        this.ready = true;
                        document.getElementById('led').className = "w-2 h-2 rounded-full bg-green-500 shadow-sm";
                        document.getElementById('status').innerText = "ONLINE";
                        document.getElementById('sbtn').disabled = false;
                        document.getElementById('nv-btn').disabled = false;
                    }
                }
            });
        } catch(e) { document.getElementById('status').innerText = "引擎失败"; }
    },

    openTool(name) {
        document.querySelectorAll('.tool-panel').forEach(p => p.classList.remove('active'));
        document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
        document.getElementById(`panel-${name}`).classList.add('active');
        document.getElementById(`tab-${name}`).classList.add('active');
    },

    async send() {
        const inp = document.getElementById('minp');
        const val = inp.value.trim();
        if(!val || !this.ready || this.busy) return;
        
        this.appendMsg("me", val);
        inp.value = '';

        if(this.pendingTool && (val.toLowerCase().includes("yes") || val.includes("好"))) {
            this.appendMsg("ai", `切换至 **${this.pendingTool}**...`);
            setTimeout(() => { this.openTool(this.pendingTool); this.pendingTool = null; }, 500);
            return;
        }

        const keys = { weather:["天气"], cal:["算"], dict:["翻译"], grade:["分"] };
        for (let t in keys) {
            if (keys[t].some(k => val.includes(k))) {
                this.pendingTool = t;
                this.appendMsg("ai", `想用 **${t}** 工具？输入 "Yes" 确认。`);
                return;
            }
        }

        const aiId = "ai-" + Date.now();
        this.appendMsg("ai", "", aiId);
        this.busy = true;
        
        try {
            const reply = await this.engine.chat.completions.create({
                messages: [{role: "system", content: this.persona}, {role: "user", content: val}],
                temperature: 0.8, max_tokens: 300, stream: true
            });
            let full = "";
            for await (const chunk of reply) {
                full += chunk.choices[0]?.delta?.content || "";
                document.getElementById(aiId).innerHTML = marked.parse(full);
                document.getElementById('scroller').scrollTo(0, 999999);
            }
        } catch(e) {}
        this.busy = false;
    },

    appendMsg(role, text, id = "") {
        const v = document.getElementById('chat-view');
        const div = document.createElement('div');
        div.className = "flex gap-3";
        div.innerHTML = `<div class="w-8 h-8 rounded bg-black text-white text-[10px] flex items-center justify-center shrink-0 font-black">${role==='me'?'U':'RG'}</div>
        <div id="${id}" class="text-sm pt-1">${text?marked.parse(text):'<span class="animate-pulse">...</span>'}</div>`;
        v.appendChild(div);
        document.getElementById('scroller').scrollTo(0, 999999);
    },

    async lookup() {
        const w = document.getElementById('dict-in').value;
        const out = document.getElementById('dict-out');
        if(!w || this.busy) return;
        
        this.busy = true;
        out.innerHTML = `<div class="p-4 bg-gray-50 rounded-xl animate-pulse italic">正在瞎编定义...</div>`;
        
        try {
            const reply = await this.engine.chat.completions.create({
                messages: [{role:"system", content: "你是阮峻。给出一个错误且损人的词义解释。必须有【定义】和【例句】。"}, {role:"user", content:w}],
                stream: true
            });
            let full = "";
            for await (const chunk of reply) {
                full += chunk.choices[0]?.delta?.content || "";
                out.innerHTML = `<div class="card bg-black text-white text-sm shadow-xl">${marked.parse(full)}</div>`;
            }
        } catch(e) { out.innerHTML = "死机了。"; }
        this.busy = false;
    },

    async createBook() {
        const t = prompt("书名:"); if(!t) return;
        this.novelHistory = [{role:"system", content:`写本小说《${t}》，虐曾俊伟。极其简短。`}];
        document.getElementById('nv-view').innerHTML = `<h1 class="text-2xl font-black">${t}</h1>`;
        this.writeChapter();
    },

    async writeChapter() {
        if(this.busy) return;
        const v = document.getElementById('nv-view');
        const cIdx = v.querySelectorAll('.ch-body').length + 1;
        const div = document.createElement('div');
        div.innerHTML = `<h2 class="font-black mt-6">第${cIdx}章</h2><div class="ch-body text-gray-500 italic">憋稿中...</div>`;
        v.appendChild(div);
        
        this.busy = true;
        try {
            const reply = await this.engine.chat.completions.create({
                messages: [...this.novelHistory, {role:"user", content:`写第${cIdx}章。`}],
                stream: true
            });
            let full = "";
            const body = div.querySelector('.ch-body');
            for await (const chunk of reply) {
                full += chunk.choices[0]?.delta?.content || "";
                body.innerText = full;
                body.className = "ch-body text-gray-700 leading-relaxed";
                v.scrollTo(0, 999999);
            }
            this.novelHistory.push({role:"assistant", content: full});
        } catch(e) { div.querySelector('.ch-body').innerText = "断片了..."; }
        this.busy = false;
    },

    calNum(v) { document.getElementById('cal-display').innerText += v; },
    calClear() { document.getElementById('cal-display').innerText = '0'; },
    calRes() { document.getElementById('cal-display').innerText = Math.floor(Math.random()*999); },
    async getWeather() {
        const city = document.getElementById('we-city').value || 'Tokyo';
        try {
            const r = await fetch(`https://wttr.in/${city}?format=j1`);
            const d = await r.json();
            const c = d.current_condition[0];
            document.getElementById('we-temp').innerText = `${c.temp_C}°C`;
            document.getElementById('we-desc').innerText = c.weatherDesc[0].value;
            document.getElementById('we-comment').innerText = `阮峻碎碎念：这里的空气比曾俊伟的脑壳还稀薄。`;
            document.getElementById('we-box').classList.remove('hidden');
        } catch(e) { alert("API 炸了"); }
    },
    rateGrade() {
        const s = document.getElementById('gr-score').value;
        const per = (s/document.getElementById('gr-full').value*100).toFixed(1);
        const res = document.getElementById('gr-res');
        res.innerText = `${per}% - ${per>90?'卷王滚！':'18分真男人！'}`;
        res.classList.remove('hidden');
    },
    saveSettings() { localStorage.setItem('rg_u', JSON.stringify({name: document.getElementById('in-name').value})); location.reload(); },
    openSettings(s) { document.getElementById('settings-modal').style.display = s?'flex':'none'; },
    rsz() { const i = document.getElementById('minp'); i.style.height='auto'; i.style.height=i.scrollHeight+'px'; }
};

window.App = App;
App.init();
</script>
</body>
</html>
